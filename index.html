<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VATSIM Gate Finder</title>
<style>
*{box-sizing:border-box;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif}
body{margin:0;background:#0b1220;color:#e5e7eb;padding:30px 16px}
.container{max-width:1100px;margin:auto}
h1{text-align:center;margin:0 0 5px}
.sub{text-align:center;color:#94a3b8;margin:0 0 22px}
.form{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;background:#111827;padding:15px;border:1px solid #243244;border-radius:14px}
label{display:block;font-size:11px;text-transform:uppercase;color:#93c5fd;font-weight:800;margin-bottom:6px}
input,button{width:100%;padding:12px;border-radius:9px;border:1px solid #334155;background:#0f172a;color:#fff}
button{background:#0284c7;border:0;font-weight:800;cursor:pointer}
.meta{margin:16px 0;color:#94a3b8}
.selection{padding:12px 14px;background:#0f1a2b;border:1px solid #26364b;border-radius:12px;margin-bottom:14px}
.selection strong{color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{padding:15px;border-radius:12px;border:1px solid #334155;background:#111827}
.available{border-color:#22c55e;background:#0d2017}
.occupied{border-color:#ef4444;background:#241113}
.incompatible{border-color:#f59e0b;background:#241b0c}
.name{font-size:20px;font-weight:900}
.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:900}
.ok{background:#14532d;color:#bbf7d0}.busy{background:#7f1d1d;color:#fecaca}.warn{background:#78350f;color:#fde68a}
.line{margin-top:8px;font-size:13px;color:#cbd5e1}
.line strong{color:#f8fafc}
.tiny{margin-top:10px;padding-top:8px;border-top:1px solid #243244;color:#64748b;font-size:10px}
.error{padding:12px;border-radius:10px;color:#fecaca;background:#3f1218;border:1px solid #7f1d1d}
.help{color:#94a3b8;font-size:12px;margin-top:8px}
@media(max-width:850px){.form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>VATSIM Gate Finder</h1>
<div class="sub">Automatische Gates · Airline · Aircraft · VATSIM Live-Belegung</div>

<div class="form">
<div><label>Airport ICAO</label><input id="icao" maxlength="4" placeholder="LDSP"></div>
<div><label>Airline</label><input id="airline" placeholder="EWG"></div>
<div><label>Aircraft</label><input id="aircraft" placeholder="A320"></div>
<div><label>&nbsp;</label><button onclick="searchGates()">Suchen</button></div>
</div>

<div id="status" class="meta"></div>
<div id="selection"></div>
<div id="results"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
["icao","airline","aircraft"].forEach(id=>$(id).addEventListener("keydown",e=>{if(e.key==="Enter")searchGates()}));

async function searchGates(){
 const icao=$("icao").value.trim().toUpperCase();
 const airline=$("airline").value.trim().toUpperCase();
 const aircraft=$("aircraft").value.trim().toUpperCase();

 if(!/^[A-Z0-9]{4}$/.test(icao)){
   $("results").innerHTML='<div class="error">Bitte einen gültigen 4-stelligen ICAO-Code eingeben.</div>';
   return;
 }

 $("status").innerText="Suche …";
 $("results").innerHTML="";
 $("selection").innerHTML="";

 try{
  const q=new URLSearchParams({icao});
  if(airline)q.set("airline",airline);
  if(aircraft)q.set("aircraft",aircraft);

  const r=await fetch("/api/gates?"+q,{cache:"no-store"});
  const d=await r.json();

  if(!r.ok){
    $("status").innerText="";
    $("results").innerHTML=`<div class="error">${esc(d.error)}<br><small>${esc(d.details||d.hint||"")}</small></div>`;
    return;
  }

  const reqCat=d.requestedAircraftCategory||"unbekannt";
  const reqSpan=d.requestedAircraftWingspanM?`${d.requestedAircraftWingspanM} m`:"unbekannt";

  $("selection").innerHTML=`
    <div class="selection">
      <strong>${esc(d.airportName)}</strong>
      · Airline: <strong>${esc(d.requestedAirline||"keine")}</strong>
      · Aircraft: <strong>${esc(d.requestedAircraft||"keine")}</strong>
      · ICAO-Kategorie: <strong>${esc(reqCat)}</strong>
      · Spannweite: <strong>${esc(reqSpan)}</strong>
      <div class="help">Belegung wird pro VATSIM-Flug nur EINEM nächstgelegenen Gate zugeordnet.</div>
    </div>`;

  $("status").innerText=
    `${d.available_count} frei & passend · ${d.occupied_count} belegt · `+
    `${d.incompatible_count} nicht passend · ${d.total_gates} Gates/Standplätze`;

  $("results").innerHTML='<div class="grid">'+d.gates.map(g=>{
    const cls=g.available?"available":(g.occupied?"occupied":"incompatible");
    const badge=g.available?'<span class="badge ok">FREI & PASSEND</span>':
                g.occupied?'<span class="badge busy">BELEGT</span>':
                '<span class="badge warn">NICHT PASSEND</span>';

    const gateAirline=g.airlines?.length
      ? esc(g.airlines.join(", "))
      : '<span style="color:#94a3b8">keine Vorgabe</span>';

    const gateSize=g.category
      ? `ICAO ${esc(g.category)}`
      : g.maxWingspanM
        ? `max. ${esc(g.maxWingspanM)} m`
        : '<span style="color:#94a3b8">keine Angabe in OSM</span>';

    const occ=g.occupant?`
      <div class="line"><strong>VATSIM:</strong> ${esc(g.occupant.callsign)}</div>
      <div class="line"><strong>Airline erkannt:</strong> ${esc(g.occupant.airline||"unbekannt")} · <strong>Aircraft:</strong> ${esc(g.occupant.aircraft||"?")}</div>
      <div class="line"><strong>Abstand:</strong> ${esc(g.occupant.distanceM)} m · <strong>Speed:</strong> ${esc(g.occupant.groundspeed)} kt</div>
    `:"";

    return `<div class="card ${cls}">
      <div class="name">${esc(g.name)}</div>
      ${badge}
      <div class="line"><strong>Typ:</strong> ${esc(g.type)}</div>
      <div class="line"><strong>Gate-Airline:</strong> ${gateAirline}</div>
      <div class="line"><strong>Gate-Größe:</strong> ${gateSize}</div>
      ${occ}
      <div class="tiny">OSM node/${esc(g.osmId)}</div>
    </div>`;
  }).join("")+"</div>";

 }catch(e){
   $("status").innerText="";
   $("results").innerHTML=`<div class="error">${esc(e.message)}</div>`;
 }
}
</script>
</body>
</html>
