<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VATSIM Gate Finder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #ffffff;
            text-transform: uppercase;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0369a1;
        }

        .status-msg {
            text-align: center;
            font-size: 1.1rem;
            margin-top: 20px;
            color: #94a3b8;
        }

        .results-header {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #38bdf8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .gate-card {
            background-color: #1e293b;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .gate-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #f1f5f9;
        }

        .gate-type {
            font-size: 0.85rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .coords {
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>VATSIM Gate Finder</h1>
        <p class="subtitle">Gib einen ICAO-Code ein, um alle Gates & Standplätze zu finden</p>

        <div class="search-box">
            <input type="text" id="icaoInput" placeholder="z. B. EDDF, LDSP, EDDH" maxlength="4">
            <button onclick="searchGates()">Suchen</button>
        </div>

        <div id="status" class="status-msg"></div>
        <div id="resultsHeader" class="results-header"></div>
        <div id="gatesGrid" class="grid"></div>
    </div>

    <script>
        // Auf Enter-Taste reagieren
        document.getElementById('icaoInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchGates();
            }
        });

        async function searchGates() {
            const input = document.getElementById('icaoInput');
            const icao = input.value.trim().toUpperCase();

            const status = document.getElementById('status');
            const resultsHeader = document.getElementById('resultsHeader');
            const gatesGrid = document.getElementById('gatesGrid');

            if (!icao || icao.length < 3) {
                status.innerText = "Bitte gib einen gültigen ICAO-Code ein.";
                return;
            }

            status.innerText = `Lade Gate-Daten für ${icao}...`;
            resultsHeader.innerText = "";
            gatesGrid.innerHTML = "";

            try {
                const response = await fetch(`/api/gates?icao=${icao}`);
                const data = await response.json();

                if (!response.ok || data.error) {
                    status.innerText = data.error || "Fehler beim Laden der Daten.";
                    return;
                }

                status.innerText = "";
                resultsHeader.innerText = `${data.total_gates} Positionen für ${data.icao} gefunden:`;

                data.gates.forEach(gate => {
                    const card = document.createElement('div');
                    card.className = 'gate-card';
                    card.innerHTML = `
                        <div class="gate-name">${gate.name}</div>
                        <div class="gate-type">${gate.type}</div>
                        <div class="coords">Lat: ${gate.lat.toFixed(4)}<br>Lon: ${gate.lon.toFixed(4)}</div>
                    `;
                    gatesGrid.appendChild(card);
                });

            } catch (err) {
                status.innerText = "Verbindungsfehler zum Server.";
            }
        }
    </script>
</body>
</html>
